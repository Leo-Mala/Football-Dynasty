name: Phase 2 Manual Validation

on:
  workflow_dispatch:
  # Temporary one-shot trigger. Remove after the Phase 2 Android gate is proven. USER
  push:
    branches:
      - phase2/compatibility-harness
    paths:
      - .github/workflows/phase2-manual-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: phase2/compatibility-harness
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Prepare the Android toolchain before Gradle configures the Android module.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Generate official Gradle Wrapper
        run: >-
          gradle wrapper
          --gradle-version 9.5.0
          --distribution-type bin
          --gradle-distribution-sha256-sum 553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746

      - name: Verify official wrapper files and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s gradlew
          test -s gradlew.bat
          echo "497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check -
          grep -Fqx 'distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -Fqx 'distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746' gradle/wrapper/gradle-wrapper.properties
          jar tf gradle/wrapper/gradle-wrapper.jar | grep -q 'org/gradle/wrapper/GradleWrapperMain.class'
          chmod +x gradlew
          ./gradlew --version --no-daemon

      - name: Gradle help
        run: ./gradlew help --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon

      # Publish only after every build gate is green, so a repository-permission
      # problem cannot hide the actual Android test/build result.
      - name: Commit official wrapper if changed
        shell: bash
        run: |
          set -euo pipefail
          git add -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: install official Gradle 9.5 wrapper"
            git push origin HEAD:phase2/compatibility-harness
          fi

      - name: Phase 2 gate summary
        if: success()
        run: |
          echo "Phase 2 Android gate passed."
          echo "Official Gradle wrapper generated and SHA-256 validated."
          echo "testDebugUnitTest: PASS"
          echo "assembleDebug: PASS"
          echo "wrapper publication: PASS"
