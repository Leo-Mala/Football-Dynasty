name: Phase 2 Manual Validation

on:
  workflow_dispatch:
  push:
    branches:
      - phase2/compatibility-harness
    paths:
      - .github/workflows/phase2-manual-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: phase2/compatibility-harness
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Generate official Gradle Wrapper
        run: gradle wrapper --gradle-version 9.5.0 --distribution-type bin

      - name: Verify official wrapper files
        shell: bash
        run: |
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s gradlew
          test -s gradlew.bat
          jar tf gradle/wrapper/gradle-wrapper.jar | grep -q 'org/gradle/wrapper/GradleWrapperMain.class'
          chmod +x gradlew
          ./gradlew --version --no-daemon

      - name: Commit official wrapper if changed
        shell: bash
        run: |
          if ! git diff --quiet -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            git commit -m "build: install official Gradle 9.5 wrapper"
            git push origin HEAD:phase2/compatibility-harness
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Gradle help
        run: ./gradlew help --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Phase 2 gate summary
        if: success()
        run: |
          echo "Phase 2 Android gate passed."
          echo "Official Gradle wrapper generated and validated."
          echo "testDebugUnitTest: PASS"
          echo "assembleDebug: PASS"
