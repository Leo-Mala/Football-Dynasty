name: Phase 2 Manual Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      # The repository API does not preserve the executable bit when creating
      # a text file, so invoke the wrapper bootstrap through bash explicitly.
      - name: Unit tests and debug build
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
