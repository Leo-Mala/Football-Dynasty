name: Phase 3 Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout phase 3 branch
        uses: actions/checkout@v5
        with:
          ref: phase3/versioned-persistence
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=3 > /tmp/sdk-packages.txt
          PLATFORM_PACKAGE="$(awk '/^[[:space:]]*platforms;android-37([^0-9]|$)/ {print $1; exit}' /tmp/sdk-packages.txt)"
          BUILD_TOOLS_PACKAGE="$(awk '/^[[:space:]]*build-tools;37\.[0-9]+\.[0-9]+/ {print $1}' /tmp/sdk-packages.txt | sort -V | tail -1)"
          if [ -z "$PLATFORM_PACKAGE" ] || [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "Android 17/API 37 SDK packages were not found in sdkmanager channel 3."
            grep -E 'platforms;android-37|build-tools;37\.' /tmp/sdk-packages.txt || true
            exit 1
          fi
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle help
        run: ./gradlew help --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Emit unit-test and benchmark evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          if not files:
              raise SystemExit('No JUnit XML files were generated')
          tests = failures = errors = skipped = 0
          benchmark = []
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
              for node in root.findall('system-out'):
                  if node.text:
                      benchmark.extend(line for line in node.text.splitlines() if 'PHASE3_FIXTURE_BENCHMARK' in line)
          print(f'PHASE3_TEST_SUMMARY tests={tests} failures={failures} errors={errors} skipped={skipped}')
          for line in benchmark:
              print(line)
          if failures or errors:
              raise SystemExit('JUnit XML reports failures/errors')
          if not benchmark:
              raise SystemExit('Phase 3 fixture benchmark evidence was not emitted')
          PY

      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify exported Room schema V1
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA_FILE="$(find app/schemas -type f -name '1.json' | head -1)"
          test -n "$SCHEMA_FILE"
          grep -Eq '"version"[[:space:]]*:[[:space:]]*1' "$SCHEMA_FILE"
          grep -q '"seniorCount"' "$SCHEMA_FILE"
          if grep -q '"playerCount"' "$SCHEMA_FILE"; then
            echo "Stale Room schema still contains playerCount."
            exit 1
          fi
          grep -q '"legacyMetadataFingerprint"' "$SCHEMA_FILE"
          grep -q '"legacyCareerFingerprint"' "$SCHEMA_FILE"
          echo "PHASE3_ROOM_SCHEMA=$SCHEMA_FILE"
          grep -m1 '"identityHash"' "$SCHEMA_FILE"

      - name: Ensure generated Room schema is committed
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- app/schemas

      - name: Phase 3 gate summary
        run: |
          echo "Gradle help: PASS"
          echo "testDebugUnitTest: PASS"
          echo "assembleDebug: PASS"
          echo "Room schema V1 export/audit: PASS"
