name: Phase 3 Validation

on:
  workflow_dispatch:
  # Temporary one-shot trigger. Removed after the Phase 3 gate is stable.
  push:
    branches:
      - phase3/versioned-persistence
    paths:
      - .github/workflows/phase3-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout phase 3 branch
        uses: actions/checkout@v5
        with:
          ref: phase3/versioned-persistence
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=3 > /tmp/sdk-packages.txt
          PLATFORM_PACKAGE="$(awk '/^[[:space:]]*platforms;android-37([^0-9]|$)/ {print $1; exit}' /tmp/sdk-packages.txt)"
          BUILD_TOOLS_PACKAGE="$(awk '/^[[:space:]]*build-tools;37\.[0-9]+\.[0-9]+/ {print $1}' /tmp/sdk-packages.txt | sort -V | tail -1)"
          if [ -z "$PLATFORM_PACKAGE" ] || [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "Android 17/API 37 SDK packages were not found in sdkmanager channel 3."
            grep -E 'platforms;android-37|build-tools;37\.' /tmp/sdk-packages.txt || true
            exit 1
          fi
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle help
        run: ./gradlew help --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify exported Room schema V1
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA_FILE="$(find app/schemas -type f -name '1.json' | head -1)"
          test -n "$SCHEMA_FILE"
          grep -Eq '"version"[[:space:]]*:[[:space:]]*1' "$SCHEMA_FILE"
          echo "Room schema: $SCHEMA_FILE"

      - name: Commit generated Room schema if changed
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/schemas
          if ! git diff --cached --quiet -- app/schemas; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: version Room schema V1 [skip ci]"
            git push origin HEAD:phase3/versioned-persistence
          fi

      - name: Phase 3 gate summary
        run: |
          echo "Gradle help: PASS"
          echo "testDebugUnitTest: PASS"
          echo "assembleDebug: PASS"
          echo "Room schema V1 export: PASS"
