name: Phase 8 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - phase8/legacy-match-engine
  pull_request:
    branches:
      - phase4/core-game-domain

permissions:
  contents: read

concurrency:
  group: phase8-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Phase 8 head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact Phase 8 head
        id: exact_head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "PHASE8_CHECKOUT_HEAD=$ACTUAL_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=3 > /tmp/sdk-packages.txt
          PLATFORM_PACKAGE="$(awk '/^[[:space:]]*platforms;android-37([^0-9]|$)/ {print $1; exit}' /tmp/sdk-packages.txt)"
          BUILD_TOOLS_PACKAGE="$(awk '/^[[:space:]]*build-tools;37\.[0-9]+\.[0-9]+/ {print $1}' /tmp/sdk-packages.txt | sort -V | tail -1)"
          test -n "$PLATFORM_PACKAGE"
          test -n "$BUILD_TOOLS_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Reject raw RNG APIs in modern gameplay domains
        shell: bash
        run: |
          set -euo pipefail
          for DIR in app/src/main/java/com/leomala/footballdynasty/domain/career app/src/main/java/com/leomala/footballdynasty/domain/match; do
            if grep -R -n -E '^[[:space:]]*import[[:space:]]+(java\.util\.Random|java\.util\.concurrent\.ThreadLocalRandom|kotlin\.random\.Random)' "$DIR"; then
              echo "Raw RNG imports are forbidden in $DIR; inject RandomSource instead."
              exit 1
            fi
            if grep -R -n -E 'Math\.random[[:space:]]*\(' "$DIR"; then
              echo "Math.random is forbidden in $DIR; inject RandomSource instead."
              exit 1
            fi
          done

      - name: Gradle help
        run: ./gradlew help --no-daemon

      - name: Room schema regression
        run: ./gradlew :app:kspDebugKotlin :app:copyRoomSchemas --no-daemon --stacktrace

      - name: Verify Room V3 identity and migration policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase/3.json')
          db = json.loads(path.read_text(encoding='utf-8'))['database']
          expected = 'a6d299fb67fcdcc51340cc62982e2d5a'
          if db.get('version') != 3 or db.get('identityHash') != expected:
              raise SystemExit(f'Room V3 drift: version={db.get("version")} identity={db.get("identityHash")}')
          print(f'ROOM_V3_IDENTITY_HASH={expected}')
          PY
          if grep -R --line-number 'fallbackToDestructiveMigration' app/src/main; then
            echo 'Destructive migration fallback is forbidden.'
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Verify Phase 8 characterization evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          if not files:
              raise SystemExit('No JUnit XML files were generated')
          required = {
              'LegacyMatchMinuteRulesTest': None,
              'LegacyMatchPlayerSelectionRulesTest': None,
              'LegacyMatchScheduleRulesTest': None,
              'LegacyMatchTransitionRulesTest': None,
              'LegacyMatchJRulesTest': None,
              'LegacyProceduralNameCorpusIntegrationTest': None,
              'Migration1To2Test': None,
              'Migration2To3Test': None,
          }
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
              suite = root.attrib.get('name', '')
              for name in required:
                  if suite.endswith(name):
                      required[name] = (
                          int(root.attrib.get('tests', 0)),
                          int(root.attrib.get('failures', 0)),
                          int(root.attrib.get('errors', 0)),
                          int(root.attrib.get('skipped', 0)),
                      )
          print(f'PHASE8_TEST_SUMMARY tests={tests} failures={failures} errors={errors} skipped={skipped}')
          print(f'PHASE8_CHARACTERIZATION={required}')
          if failures or errors:
              raise SystemExit('JUnit XML reports failures/errors')
          for name, evidence in required.items():
              if evidence is None:
                  raise SystemExit(f'{name} evidence missing')
              count, f, e, s = evidence
              if count <= 0 or f or e or s:
                  raise SystemExit(f'{name} is not fully green: {evidence}')
          schedule = required['LegacyMatchScheduleRulesTest']
          if schedule[0] < 8:
              raise SystemExit(
                  'LegacyMatchScheduleRulesTest lost required Q0 characterization coverage: '
                  f'expected at least 8 tests, got {schedule[0]}'
              )
          print(f'PHASE8_Q0_SCHEDULE_CHARACTERIZATION={schedule[0]} tests')
          PY

      - name: Verify official corpus remains materialized
        shell: bash
        run: |
          set -euo pipefail
          test "$(find app/src/main/assets/names -maxdepth 1 -type f -name '*.txt' | wc -l)" -eq 221
          test "$(find app/src/main/assets/surnames -maxdepth 1 -type f -name '*.txt' | wc -l)" -eq 221
          test ! -e app/src/main/assets/bootstrap
          test ! -e app/src/main/assets/bootstrap_v2

      - name: Verify active Brasfoot 2026 fixture integrity
        shell: bash
        run: |
          set -euo pipefail
          base64 -d app/src/test/resources/legacy/trepenne_smr.ban.b64 > /tmp/trepenne_smr.ban
          printf '%s  %s\n' 'c664cc841b44e39423835795b00bb1c248862eb0a0e1c579831857d748fa9281' '/tmp/trepenne_smr.ban' | sha256sum --check --strict

      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Phase 8 gate summary
        run: |
          echo "Exact Phase 8 head checkout: PASS (${{ steps.exact_head.outputs.sha }})"
          echo "Raw gameplay-domain RNG guard: PASS"
          echo "Legacy best.s.k direct RNG characterization: PASS"
          echo "Legacy best.s.S/T/U/V/W selection characterization: PASS"
          echo "Legacy best.s.m schedule initialization characterization: PASS"
          echo "Legacy best.s.Q0 added-time/halftime ordering characterization: PASS"
          echo "Legacy best.s.r/r0 transition characterization: PASS"
          echo "Legacy best.s.j second-half transition scheduling characterization: PASS"
          echo "Phase 7 corpus/runtime regressions: PASS"
          echo "Room V3 migration policy: PASS"
          echo "Active Brasfoot 2026 fixture integrity: PASS"
          echo "assembleDebug: PASS"
