name: Phase 15 Stage V14 Guard

on:
  pull_request:
    branches: [phase4/core-game-domain]

permissions:
  actions: read
  contents: write

concurrency:
  group: phase15-stage-v14-guard-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  stage:
    if: github.event.pull_request.head.ref == 'milestone-c/full-legacy-parity-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Download verified V14 guard artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9925189330/zip > /tmp/guard.zip
          rm -rf /tmp/guard && mkdir /tmp/guard
          unzip -q /tmp/guard.zip -d /tmp/guard
          test -f /tmp/guard/phase4r-validation.yml
          printf '%s  %s\n' 'fd55f37dc5813246a06e892c64dfbb55e733d150860fde790b24bed419e20dbb' '/tmp/guard/phase4r-validation.yml' | sha256sum --check --strict
      - name: Commit verified guard as ordinary staging blob
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mkdir -p .phase15-staging
          cp /tmp/guard/phase4r-validation.yml .phase15-staging/phase4r-validation-v14.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .phase15-staging/phase4r-validation-v14.yml
          git commit -m 'ci: stage verified Phase 7 V14 guard blob'
          git push origin "HEAD:${HEAD_REF}"
