name: Phase 4 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - phase4/core-game-domain
    paths:
      - .github/workflows/phase4-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout phase 4 branch
        uses: actions/checkout@v5
        with:
          ref: phase4/core-game-domain
          fetch-depth: 0

      - name: Publish validation run marker
        shell: bash
        run: |
          set -euo pipefail
          printf 'run_id=%s\nvalidated_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .github/phase4-last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/phase4-last-run.txt
          git commit -m "ci: record phase4 validation run ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:phase4/core-game-domain

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=3 > /tmp/sdk-packages.txt
          PLATFORM_PACKAGE="$(awk '/^[[:space:]]*platforms;android-37([^0-9]|$)/ {print $1; exit}' /tmp/sdk-packages.txt)"
          BUILD_TOOLS_PACKAGE="$(awk '/^[[:space:]]*build-tools;37\.[0-9]+\.[0-9]+/ {print $1}' /tmp/sdk-packages.txt | sort -V | tail -1)"
          if [ -z "$PLATFORM_PACKAGE" ] || [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "Android 17/API 37 SDK packages were not found in sdkmanager channel 3."
            grep -E 'platforms;android-37|build-tools;37\.' /tmp/sdk-packages.txt || true
            exit 1
          fi
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Gradle help
        run: ./gradlew help --no-daemon

      - name: Generate Room schema V2 before migration tests
        run: ./gradlew :app:kspDebugKotlin :app:copyRoomSchemas --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Emit unit-test and performance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          if not files:
              raise SystemExit('No JUnit XML files were generated')
          tests = failures = errors = skipped = 0
          benchmark = []
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
              for node in root.findall('system-out'):
                  if node.text:
                      benchmark.extend(line for line in node.text.splitlines() if 'PHASE4_CORE_BENCHMARK' in line)
          print(f'PHASE4_TEST_SUMMARY tests={tests} failures={failures} errors={errors} skipped={skipped}')
          for line in benchmark:
              print(line)
          if failures or errors:
              raise SystemExit('JUnit XML reports failures/errors')
          if not benchmark:
              raise SystemExit('Phase 4 performance evidence was not emitted')
          PY

      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Room schemas and migration policy
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA_DIR="app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase"
          V1="$SCHEMA_DIR/1.json"
          V2="$SCHEMA_DIR/2.json"
          test -s "$V1"
          test -s "$V2"
          grep -Eq '"version"[[:space:]]*:[[:space:]]*2' "$V2"
          grep -q '"tableName": "career_core_state"' "$V2"
          grep -q '"seasonNumber"' "$V2"
          grep -q '"rngInternalState"' "$V2"
          grep -q '"managedClubId"' "$V2"
          grep -q '"careerId"' "$V2"
          git diff --exit-code origin/phase3/versioned-persistence -- "$V1"
          if grep -R --line-number 'fallbackToDestructiveMigration' app/src/main; then
            echo 'Destructive migration fallback is forbidden.'
            exit 1
          fi
          echo "PHASE4_ROOM_SCHEMA=$V2"
          grep -m1 '"identityHash"' "$V2"

      - name: Commit generated Room schema V2 if changed
        shell: bash
        run: |
          set -euo pipefail
          git add -- app/schemas
          if ! git diff --cached --quiet -- app/schemas; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: export Room schema V2 for phase4 [skip ci]"
            git push origin HEAD:phase4/core-game-domain
          fi

      - name: Phase 4 gate summary
        run: |
          echo "Gradle help: PASS"
          echo "Room schema V2 generation: PASS"
          echo "testDebugUnitTest: PASS"
          echo "assembleDebug: PASS"
          echo "Room V1->V2 migration/schema audit: PASS"
