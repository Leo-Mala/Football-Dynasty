name: Phase 7 Corpus Bootstrap

on:
  pull_request:
    branches:
      - phase4/core-game-domain

permissions:
  contents: write

concurrency:
  group: phase7-corpus-bootstrap-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Phase 7 head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reconstruct and verify official corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import bz2
          import hashlib
          import re
          import shutil
          import struct
          from pathlib import Path

          repo = Path('.')
          staging = repo / 'app/src/main/assets/bootstrap_v2'
          parts = [staging / f'{i:02d}.part' for i in range(51)]
          missing = [p.name for p in parts if not p.is_file()]
          if missing:
              raise SystemExit(f'Bootstrap V2 parts missing: {missing}')
          for i, part in enumerate(parts):
              expected_size = 1820 if i == 50 else 4000
              actual_size = part.stat().st_size
              if actual_size != expected_size:
                  raise SystemExit(f'Bootstrap V2 part {i:02d} size mismatch: {actual_size} != {expected_size}')

          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          compressed = base64.b64decode(encoded, validate=True)
          compressed_sha = hashlib.sha256(compressed).hexdigest()
          expected_compressed = 'e108dc683f0814983c4d0d5d853f3a6fd6b8115e1bd66de9bcc63451083b5fe1'
          if compressed_sha != expected_compressed:
              raise SystemExit(f'Bootstrap V2 BZip2 SHA mismatch: {compressed_sha}')

          container = bz2.decompress(compressed)
          container_sha = hashlib.sha256(container).hexdigest()
          expected_container = 'a163228e3f78a0132abb11049456f6187afb8683a39a8126a57a8a34a8837634'
          if container_sha != expected_container:
              raise SystemExit(f'Bootstrap V2 FDNC1 SHA mismatch: {container_sha}')
          if not container.startswith(b'FDNC1'):
              raise SystemExit('Invalid FDNC1 magic')

          offset = 5
          count = struct.unpack_from('>I', container, offset)[0]
          offset += 4
          if count != 442:
              raise SystemExit(f'FDNC1 entry count changed: {count}')

          entries = {}
          for _ in range(count):
              path_len = struct.unpack_from('>I', container, offset)[0]
              offset += 4
              path = container[offset:offset + path_len].decode('ascii')
              offset += path_len
              data_len = struct.unpack_from('>I', container, offset)[0]
              offset += 4
              data = container[offset:offset + data_len]
              offset += data_len
              if path in entries:
                  raise SystemExit(f'Duplicate FDNC1 path: {path}')
              if re.fullmatch(r'(names|surnames)/[A-Z0-9]{3}\.txt', path) is None:
                  raise SystemExit(f'Unexpected FDNC1 path: {path}')
              entries[path] = data
          if offset != len(container):
              raise SystemExit(f'FDNC1 trailing bytes: parsed={offset} total={len(container)}')

          code_source = (repo / 'app/src/main/java/com/leomala/footballdynasty/domain/career/LegacyCountryAssetCodes.kt').read_text(encoding='utf-8')
          try:
              code_block = code_source.split('private val codes = arrayOf(', 1)[1].split('\n    )', 1)[0]
          except IndexError as exc:
              raise SystemExit('Could not parse LegacyCountryAssetCodes.codes') from exc
          codes = re.findall(r'"([A-Z0-9]{3})"', code_block)
          if len(codes) != 221 or len(set(codes)) != 221:
              raise SystemExit(f'Legacy country asset code table changed: {len(codes)}')
          expected_paths = ({f'names/{c}.txt' for c in codes} | {f'surnames/{c}.txt' for c in codes})
          if set(entries) != expected_paths:
              raise SystemExit('FDNC1 paths do not match LegacyCountryAssetCodes')

          total_bytes = sum(len(v) for v in entries.values())
          if total_bytes != 495785:
              raise SystemExit(f'Official corpus byte count changed: {total_bytes}')

          physical_rows = []
          semantic_rows = []
          for path in sorted(entries):
              raw = entries[path]
              legacy_path = f'resources/assets/{path}'
              physical_rows.append(f'{legacy_path}\t{hashlib.sha256(raw).hexdigest()}\t{len(raw)}\n')
              text = raw.decode('utf-8', errors='replace')
              accepted = [line for line in text.splitlines() if line and '.' not in line and re.search(r'\d+', line) is None]
              if not accepted:
                  raise SystemExit(f'Legacy best.u.b filter produced empty asset: {path}')
              inner = ''.join(f'{line}\n' for line in accepted).encode('utf-8')
              semantic_rows.append(f'{legacy_path}\t{hashlib.sha256(inner).hexdigest()}\t{len(accepted)}\n')

          physical = hashlib.sha256(''.join(physical_rows).encode('utf-8')).hexdigest()
          semantic = hashlib.sha256(''.join(semantic_rows).encode('utf-8')).hexdigest()
          if physical != '4b8c6db9b6343221cb6e945aef7ba0d7dc081c4744e30bb1f9a0eba3c57e444b':
              raise SystemExit(f'Physical manifest mismatch: {physical}')
          if semantic != 'd4cb2a6fd770a7bcdb850ee63b31d6442b66a3da70611f7a100e264b1f2c625f':
              raise SystemExit(f'Semantic manifest mismatch: {semantic}')

          assets = repo / 'app/src/main/assets'
          for path, raw in entries.items():
              target = assets / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)

          old_bootstrap = assets / 'bootstrap'
          if old_bootstrap.exists():
              shutil.rmtree(old_bootstrap)
          shutil.rmtree(staging)
          (repo / '.github/workflows/phase7-corpus-bootstrap.yml').unlink()

          print('PHASE7_CORPUS_BOOTSTRAP_V2=PASS')
          print('PHASE7_CORPUS_COUNT=442')
          print(f'PHASE7_CORPUS_BYTES={total_bytes}')
          print(f'PHASE7_CORPUS_PHYSICAL={physical}')
          print(f'PHASE7_CORPUS_SEMANTIC={semantic}')
          print(f'PHASE7_CORPUS_BZIP2={compressed_sha}')
          print(f'PHASE7_CORPUS_FDNC1={container_sha}')
          PY

      - name: Commit official corpus to Phase 7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No corpus changes to commit'; exit 0; }
          git commit -m 'feat: materialize official Brasfoot procedural name corpus'
          git push origin HEAD:phase7/procedural-player-runtime
