name: Phase 7 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - phase7/procedural-player-runtime
  pull_request:
    branches:
      - phase4/core-game-domain

permissions:
  contents: read

concurrency:
  group: phase7-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Phase 7 head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact Phase 7 head
        id: exact_head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "PHASE7_CHECKOUT_HEAD=$ACTUAL_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=3 > /tmp/sdk-packages.txt
          PLATFORM_PACKAGE="$(awk '/^[[:space:]]*platforms;android-37([^0-9]|$)/ {print $1; exit}' /tmp/sdk-packages.txt)"
          BUILD_TOOLS_PACKAGE="$(awk '/^[[:space:]]*build-tools;37\.[0-9]+\.[0-9]+/ {print $1}' /tmp/sdk-packages.txt | sort -V | tail -1)"
          test -n "$PLATFORM_PACKAGE"
          test -n "$BUILD_TOOLS_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Reject raw RNG APIs in modern career domain
        shell: bash
        run: |
          set -euo pipefail
          CAREER_DIR=app/src/main/java/com/leomala/footballdynasty/domain/career
          if grep -R -n -E '^[[:space:]]*import[[:space:]]+(java\.util\.Random|java\.util\.concurrent\.ThreadLocalRandom|kotlin\.random\.Random)' "$CAREER_DIR"; then
            echo 'Raw RNG imports are forbidden in the modern career domain; inject RandomSource instead.'
            exit 1
          fi
          if grep -R -n -E 'Math\.random[[:space:]]*\(' "$CAREER_DIR"; then
            echo 'Math.random is forbidden in the modern career domain; inject RandomSource instead.'
            exit 1
          fi

      - name: Gradle help
        run: ./gradlew help --no-daemon

      - name: Snapshot versioned Room schemas
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA_DIR="app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase"
          rm -rf /tmp/versioned-room-schemas
          mkdir -p /tmp/versioned-room-schemas
          cp "$SCHEMA_DIR"/*.json /tmp/versioned-room-schemas/

      - name: Generate Room schemas through V5
        run: ./gradlew :app:kspDebugKotlin :app:copyRoomSchemas --no-daemon --stacktrace

      - name: Retain generated Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: phase7-room-schemas-${{ steps.exact_head.outputs.sha }}
          path: app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: JUnit and performance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          if not files:
              raise SystemExit('No JUnit XML files were generated')
          tests = failures = errors = skipped = 0
          benchmark = []
          required = {
              'LegacyCareerCalendarCharacterizationTest': None,
              'LegacySeasonLifecycleOrderTest': None,
              'LegacyAnnualRandomRulesTest': None,
              'LegacyAnnualSelectionRulesTest': None,
              'LegacyAnnualSquadFloorRulesTest': None,
              'LegacyAnnualA0IRulesTest': None,
              'LegacyAnnualA0OrchestrationRulesTest': None,
              'LegacyAnnualJAndBestFDeepTest': None,
              'LegacyAnnualPlayerMovementRulesTest': None,
              'LegacyProceduralPlayerRulesTest': None,
              'LegacyProceduralNameRulesTest': None,
              'LegacyProceduralToPlayerRulesTest': None,
              'LegacyCareerPlayerInitializationRulesTest': None,
              'LegacyCountryAssetCodesTest': None,
              'LegacyPlayerValueRulesTest': None,
              'LegacyProceduralMaterializationRulesTest': None,
              'CareerPlayerRuntimeMapperTest': None,
              'CareerPlayerRuntimeStoreTest': None,
              'CareerMatchStoreTest': None,
              'CareerMatchPersistedRuntimeResolverTest': None,
              'CareerMatchEnergyPersistenceTest': None,
              'CareerMatchPersistedEffectsMapperTest': None,
              'LegacyMatchEnergyRulesTest': None,
              'LegacyProceduralNameAssetLoaderTest': None,
              'LegacyProceduralNameCorpusIntegrationTest': None,
              'Migration1To2Test': None,
              'Migration2To3Test': None,
              'Migration3To4Test': None,
              'Migration4To5Test': None,
          }
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
              suite = root.attrib.get('name', '')
              for name in required:
                  if suite.endswith(name):
                      required[name] = (
                          root.attrib.get('tests', '0'), root.attrib.get('failures', '0'),
                          root.attrib.get('errors', '0'), root.attrib.get('skipped', '0'),
                      )
              for node in root.findall('system-out'):
                  if node.text:
                      benchmark.extend(line for line in node.text.splitlines() if 'PHASE4_CORE_BENCHMARK' in line)
          print(f'PHASE7_TEST_SUMMARY tests={tests} failures={failures} errors={errors} skipped={skipped}')
          print(f'PHASE7_CHARACTERIZATION={required}')
          for line in benchmark:
              print(line)
          if failures or errors:
              raise SystemExit('JUnit XML reports failures/errors')
          if not benchmark:
              raise SystemExit('Core performance evidence was not emitted')
          for name, evidence in required.items():
              if evidence is None:
                  raise SystemExit(f'{name} evidence missing')
              count, f, e, s = evidence
              if int(count) <= 0:
                  raise SystemExit(f'{name} did not execute any tests')
              if f != '0' or e != '0' or s != '0':
                  raise SystemExit(f'{name} is not fully green')
          PY

      - name: Verify official Brasfoot 2026 procedural name corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import re
          from pathlib import Path
          assets_root = Path('app/src/main/assets')
          code_source = Path('app/src/main/java/com/leomala/footballdynasty/domain/career/LegacyCountryAssetCodes.kt').read_text(encoding='utf-8')
          try:
              code_block = code_source.split('private val codes = arrayOf(', 1)[1].split('\n    )', 1)[0]
          except IndexError as exc:
              raise SystemExit('Could not parse LegacyCountryAssetCodes.codes') from exc
          codes = re.findall(r'"([A-Z0-9]{3})"', code_block)
          if len(codes) != 221 or len(set(codes)) != 221:
              raise SystemExit(f'Legacy country asset code table changed: {len(codes)}')
          expected = ({f'names/{c}.txt' for c in codes} | {f'surnames/{c}.txt' for c in codes})
          actual = {
              str(p.relative_to(assets_root)).replace('\\', '/')
              for root in (assets_root / 'names', assets_root / 'surnames')
              for p in root.glob('*.txt')
          }
          if actual != expected or len(actual) != 442:
              raise SystemExit(f'Official name corpus paths mismatch: missing={sorted(expected-actual)[:5]} extra={sorted(actual-expected)[:5]}')
          physical_rows = []
          semantic_rows = []
          total_bytes = 0
          for path in sorted(expected):
              raw = (assets_root / path).read_bytes()
              total_bytes += len(raw)
              legacy_path = f'resources/assets/{path}'
              physical_rows.append(f'{legacy_path}\t{hashlib.sha256(raw).hexdigest()}\t{len(raw)}\n')
              text = raw.decode('utf-8', errors='replace')
              accepted = [line for line in text.splitlines() if line and '.' not in line and re.search(r'\d+', line) is None]
              if not accepted:
                  raise SystemExit(f'Legacy best.u.b filter produced an empty asset: {path}')
              inner = ''.join(f'{line}\n' for line in accepted).encode('utf-8')
              semantic_rows.append(f'{legacy_path}\t{hashlib.sha256(inner).hexdigest()}\t{len(accepted)}\n')
          if total_bytes != 495785:
              raise SystemExit(f'Official name corpus byte count changed: {total_bytes}')
          physical = hashlib.sha256(''.join(physical_rows).encode()).hexdigest()
          semantic = hashlib.sha256(''.join(semantic_rows).encode()).hexdigest()
          if physical != '4b8c6db9b6343221cb6e945aef7ba0d7dc081c4744e30bb1f9a0eba3c57e444b':
              raise SystemExit(f'Physical manifest mismatch: {physical}')
          if semantic != 'd4cb2a6fd770a7bcdb850ee63b31d6442b66a3da70611f7a100e264b1f2c625f':
              raise SystemExit(f'Semantic manifest mismatch: {semantic}')
          forbidden = [p for p in assets_root.iterdir() if p.name.startswith('bootstrap') or p.name.startswith('legacy_name_corpus')]
          if forbidden:
              raise SystemExit(f'Temporary corpus transport remains in runtime assets: {[p.name for p in forbidden]}')
          print('PHASE7_NAME_CORPUS_COUNT=442')
          print(f'PHASE7_NAME_CORPUS_BYTES={total_bytes}')
          print(f'PHASE7_NAME_CORPUS_PHYSICAL={physical}')
          print(f'PHASE7_NAME_CORPUS_SEMANTIC={semantic}')
          PY

      - name: Verify active Brasfoot 2026 fixture integrity
        shell: bash
        run: |
          set -euo pipefail
          base64 -d app/src/test/resources/legacy/trepenne_smr.ban.b64 > /tmp/trepenne_smr.ban
          printf '%s  %s\n' 'c664cc841b44e39423835795b00bb1c248862eb0a0e1c579831857d748fa9281' '/tmp/trepenne_smr.ban' | sha256sum --check --strict

      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Room schemas and migration policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          schema_dir = Path('app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase')
          baseline_dir = Path('/tmp/versioned-room-schemas')
          legacy_files = {'1.json', '2.json', '3.json'}
          expected_files = legacy_files | {'5.json'}
          generated_files = {p.name for p in schema_dir.glob('*.json')}
          baseline_files = {p.name for p in baseline_dir.glob('*.json')}
          if generated_files != expected_files:
              raise SystemExit(f'Unexpected generated Room schema set: {sorted(generated_files)}')
          if baseline_files != legacy_files:
              raise SystemExit(f'Historical versioned Room schema baseline changed: {sorted(baseline_files)}')
          expected_identity = {
              1: '37c2e4df984290903730a25553bdbed5',
              2: 'fc4ed30d6548037a1226144e0c576c59',
              3: 'a6d299fb67fcdcc51340cc62982e2d5a',
          }
          generated = {}
          for version in (1, 2, 3):
              name = f'{version}.json'
              before = json.loads((baseline_dir / name).read_text(encoding='utf-8'))
              after = json.loads((schema_dir / name).read_text(encoding='utf-8'))
              if before != after:
                  raise SystemExit(f'Generated Room schema {name} differs structurally from versioned schema')
              db = after.get('database', {})
              if db.get('version') != version or db.get('identityHash') != expected_identity[version]:
                  raise SystemExit(f'Room schema {name} identity/version changed')
              generated[version] = after
          v5 = json.loads((schema_dir / '5.json').read_text(encoding='utf-8'))
          v5db = v5.get('database', {})
          if v5db.get('version') != 5 or v5db.get('identityHash') != 'ca3f563cb8ded49fd2d64dbb3cd851a1':
              raise SystemExit(
                  f'Room V5 drift: version={v5db.get("version")} identity={v5db.get("identityHash")}'
              )
          phase3_v1 = json.loads(subprocess.check_output([
              'git', 'show', 'origin/phase3/versioned-persistence:app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase/1.json'
          ], text=True))
          if generated[1] != phase3_v1:
              raise SystemExit('Room V1 schema changed semantically from phase3/versioned-persistence')
          v3_entities = {e.get('tableName'): e for e in generated[3].get('database', {}).get('entities', [])}
          required_tables = {'career_core_state','career_player_runtime','career_procedural_players','career_squad_memberships'}
          missing = required_tables - set(v3_entities)
          if missing:
              raise SystemExit(f'Room V3 missing required tables: {sorted(missing)}')
          membership = v3_entities['career_squad_memberships']
          club_fk = any(
              fk.get('table') == 'clubs' and fk.get('columns') == ['clubId']
              and fk.get('referencedColumns') == ['id'] and fk.get('onDelete') == 'NO ACTION'
              and fk.get('onUpdate') == 'NO ACTION' for fk in membership.get('foreignKeys', [])
          )
          if not club_fk:
              raise SystemExit('career_squad_memberships.clubId must reference clubs.id with NO ACTION')
          v5_entities = {e.get('tableName'): e for e in v5db.get('entities', [])}
          if not set(v3_entities).issubset(v5_entities):
              raise SystemExit('Room V5 must preserve every V3 table')
          scheduled = v5_entities.get('career_scheduled_matches')
          if scheduled is None:
              raise SystemExit('Room V5 missing the V4 career_scheduled_matches table')
          scheduled_fields = {f.get('columnName') for f in scheduled.get('fields', [])}
          expected_scheduled_fields = {
              'careerId','matchId','dayIndex','eventTypeCode','homeClubId','awayClubId',
              'processed','homeGoals','awayGoals'
          }
          if scheduled_fields != expected_scheduled_fields:
              raise SystemExit(f'career_scheduled_matches fields changed: {sorted(scheduled_fields)}')
          scheduled_fks = scheduled.get('foreignKeys', [])
          def has_fk(fks, table, columns, referenced, delete):
              return any(
                  fk.get('table') == table and fk.get('columns') == columns
                  and fk.get('referencedColumns') == referenced and fk.get('onDelete') == delete
                  and fk.get('onUpdate') == 'NO ACTION' for fk in fks
              )
          if not has_fk(scheduled_fks, 'career_metadata', ['careerId'], ['id'], 'CASCADE'):
              raise SystemExit('career_scheduled_matches.careerId FK policy changed')
          if not has_fk(scheduled_fks, 'clubs', ['homeClubId'], ['id'], 'NO ACTION'):
              raise SystemExit('career_scheduled_matches.homeClubId FK policy changed')
          if not has_fk(scheduled_fks, 'clubs', ['awayClubId'], ['id'], 'NO ACTION'):
              raise SystemExit('career_scheduled_matches.awayClubId FK policy changed')
          v3_runtime_fields = {f.get('columnName') for f in v3_entities['career_player_runtime'].get('fields', [])}
          v5_runtime = v5_entities['career_player_runtime']
          v5_runtime_fields = {f.get('columnName') for f in v5_runtime.get('fields', [])}
          if v5_runtime_fields != v3_runtime_fields | {'energy', 'injuryUntilEpochDay'}:
              raise SystemExit(f'career_player_runtime V5 fields changed unexpectedly: {sorted(v5_runtime_fields)}')
          runtime_by_name = {f.get('columnName'): f for f in v5_runtime.get('fields', [])}
          if runtime_by_name['energy'].get('defaultValue') != '100':
              raise SystemExit('career_player_runtime.energy default must preserve legacy initial 100')
          if runtime_by_name['injuryUntilEpochDay'].get('defaultValue') != '0':
              raise SystemExit('career_player_runtime.injuryUntilEpochDay default must be 0')
          stats = v5_entities.get('career_player_club_season_stats')
          if stats is None:
              raise SystemExit('Room V5 missing career_player_club_season_stats')
          stats_fields = {f.get('columnName') for f in stats.get('fields', [])}
          expected_stats_fields = {
              'careerId','playerId','legacySeasonId','legacyClubId',
              'legacyC','legacyD','legacyE','legacyF','legacyG','legacyH'
          }
          if stats_fields != expected_stats_fields:
              raise SystemExit(f'career_player_club_season_stats fields changed: {sorted(stats_fields)}')
          if stats.get('primaryKey', {}).get('columnNames') != [
              'careerId','playerId','legacySeasonId','legacyClubId'
          ]:
              raise SystemExit('career_player_club_season_stats primary key changed')
          if not has_fk(
              stats.get('foreignKeys', []),
              'career_player_runtime',
              ['careerId','playerId'],
              ['careerId','playerId'],
              'CASCADE',
          ):
              raise SystemExit('career_player_club_season_stats player FK policy changed')
          db_source = Path('app/src/main/java/com/leomala/footballdynasty/data/local/FootballDynastyDatabase.kt').read_text()
          migrations_source = Path('app/src/main/java/com/leomala/footballdynasty/data/local/FootballDynastyDatabaseFactory.kt').read_text()
          if 'const val SCHEMA_VERSION: Int = 5' not in db_source:
              raise SystemExit('FootballDynastyDatabase.SCHEMA_VERSION must be 5 for Phase 9')
          for transition in ('Migration(1, 2)', 'Migration(2, 3)', 'Migration(3, 4)', 'Migration(4, 5)'):
              if transition not in migrations_source:
                  raise SystemExit(f'Explicit Room migration missing: {transition}')
          if 'arrayOf(MIGRATION_1_2, MIGRATION_2_3, MIGRATION_3_4, MIGRATION_4_5)' not in migrations_source:
              raise SystemExit('Migration registry must explicitly preserve 1->2->3->4->5')
          print('ROOM_SCHEMA_SEMANTIC_COMPARE=PASS')
          print(f'ROOM_V3_IDENTITY_HASH={expected_identity[3]}')
          print(f'ROOM_V5_IDENTITY_HASH={v5db.get("identityHash")}')
          PY
          if grep -R --line-number 'fallbackToDestructiveMigration' app/src/main; then
            echo 'Destructive migration fallback is forbidden.'
            exit 1
          fi

      - name: Phase 7 gate summary
        run: |
          echo "Exact Phase 7 head checkout: PASS (${{ steps.exact_head.outputs.sha }})"
          echo "Raw career-domain RNG guard: PASS"
          echo "Gradle help: PASS"
          echo "Room schemas through V5 generation: PASS"
          echo "Room V1/V2/V3 immutable regression + V4/V5 migration validation: PASS"
          echo "testDebugUnitTest: PASS"
          echo "Brasfoot 2026 calendar/lifecycle regressions: PASS"
          echo "Brasfoot 2026 annual selection/movement regressions: PASS"
          echo "Brasfoot 2026 procedural p.d structural RNG: PASS"
          echo "Brasfoot 2026 procedural best.u.c name RNG: PASS"
          echo "Brasfoot 2026 official 442-file direct name corpus + runtime loader: PASS"
          echo "Brasfoot 2026 procedural best.t.e RNG/control: PASS"
          echo "Brasfoot 2026 q1/value/materialization regressions: PASS"
          echo "Brasfoot 2026 P0..P220 asset/group maps: PASS"
          echo "Career-scoped runtime + match persistence isolation/reopen/atomic rollback: PASS"
          echo "Phase 9 persisted match energy/injury effects + rollback: PASS"
          echo "Room V1->V2, V2->V3, V3->V4 and V4->V5 migration tests: PASS"
          echo "Brasfoot 2026 active fixture integrity: PASS"
          echo "assembleDebug: PASS"
          echo "Room V1/V2/V3 + explicit V3->V4->V5 migration policy: PASS"
