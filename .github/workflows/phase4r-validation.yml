name: Phase 4R Validation

on:
  workflow_dispatch:
  push:
    branches:
      - phase4r/brasfoot-2026-rebaseline

permissions:
  contents: read

concurrency:
  group: phase4r-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Phase 4R head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=3 > /tmp/sdk-packages.txt
          PLATFORM_PACKAGE="$(awk '/^[[:space:]]*platforms;android-37([^0-9]|$)/ {print $1; exit}' /tmp/sdk-packages.txt)"
          BUILD_TOOLS_PACKAGE="$(awk '/^[[:space:]]*build-tools;37\.[0-9]+\.[0-9]+/ {print $1}' /tmp/sdk-packages.txt | sort -V | tail -1)"
          test -n "$PLATFORM_PACKAGE"
          test -n "$BUILD_TOOLS_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Gradle help
        run: ./gradlew help --no-daemon

      - name: Generate Room schema V2
        run: ./gradlew :app:kspDebugKotlin :app:copyRoomSchemas --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: JUnit and performance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          if not files:
              raise SystemExit('No JUnit XML files were generated')
          tests = failures = errors = skipped = 0
          benchmark = []
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
              for node in root.findall('system-out'):
                  if node.text:
                      benchmark.extend(line for line in node.text.splitlines() if 'PHASE4_CORE_BENCHMARK' in line)
          print(f'PHASE4R_TEST_SUMMARY tests={tests} failures={failures} errors={errors} skipped={skipped}')
          for line in benchmark:
              print(line)
          if failures or errors:
              raise SystemExit('JUnit XML reports failures/errors')
          if not benchmark:
              raise SystemExit('Phase 4 core performance evidence was not emitted')
          PY

      - name: Verify active Brasfoot 2026 fixture integrity
        shell: bash
        run: |
          set -euo pipefail
          base64 -d app/src/test/resources/legacy/trepenne_smr.ban.b64 > /tmp/trepenne_smr.ban
          printf '%s  %s\n' \
            'c664cc841b44e39423835795b00bb1c248862eb0a0e1c579831857d748fa9281' \
            '/tmp/trepenne_smr.ban' | sha256sum --check --strict

      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Room schemas and migration policy
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA_DIR="app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase"
          V1="$SCHEMA_DIR/1.json"
          V2="$SCHEMA_DIR/2.json"
          test -s "$V1"
          test -s "$V2"
          grep -Eq '"version"[[:space:]]*:[[:space:]]*2' "$V2"
          grep -q '"tableName": "career_core_state"' "$V2"
          grep -q '"seasonNumber"' "$V2"
          grep -q '"rngInternalState"' "$V2"
          grep -q '"managedClubId"' "$V2"
          grep -q '"careerId"' "$V2"
          git diff --exit-code origin/phase3/versioned-persistence -- "$V1"
          if grep -R --line-number 'fallbackToDestructiveMigration' app/src/main; then
            echo 'Destructive migration fallback is forbidden.'
            exit 1
          fi
          git diff --exit-code -- app/schemas

      - name: Phase 4R gate summary
        run: |
          echo "Gradle help: PASS"
          echo "Room schema V2 generation: PASS"
          echo "testDebugUnitTest: PASS"
          echo "Brasfoot 2026 active fixture integrity: PASS"
          echo "assembleDebug: PASS"
          echo "Room V1->V2 migration/schema audit: PASS"
