name: Phase 7 Validation

on:
  workflow_dispatch:
  push:
    branches: [phase7/procedural-player-runtime]
  pull_request:
    branches: [phase4/core-game-domain]

permissions:
  contents: write

concurrency:
  group: phase7-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Phase 7 head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact Phase 7 head
        id: exact_head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
          echo "sha=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "PHASE7_CHECKOUT_HEAD=$ACTUAL"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=3 > /tmp/sdk-packages.txt
          PLATFORM="$(awk '/^[[:space:]]*platforms;android-37([^0-9]|$)/ {print $1; exit}' /tmp/sdk-packages.txt)"
          BUILD_TOOLS="$(awk '/^[[:space:]]*build-tools;37\.[0-9]+\.[0-9]+/ {print $1}' /tmp/sdk-packages.txt | sort -V | tail -1)"
          test -n "$PLATFORM" && test -n "$BUILD_TOOLS"
          sdkmanager --channel=3 "$PLATFORM" "$BUILD_TOOLS"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Reject raw RNG APIs and destructive migration
        shell: bash
        run: |
          set -euo pipefail
          CAREER=app/src/main/java/com/leomala/footballdynasty/domain/career
          ! grep -R -n -E '^[[:space:]]*import[[:space:]]+(java\.util\.Random|java\.util\.concurrent\.ThreadLocalRandom|kotlin\.random\.Random)' "$CAREER"
          ! grep -R -n -E 'Math\.random[[:space:]]*\(' "$CAREER"
          ! grep -R --line-number 'fallbackToDestructiveMigration' app/src/main

      - name: Gradle help
        run: ./gradlew help --no-daemon

      - name: Snapshot versioned Room schemas
        shell: bash
        run: |
          set -euo pipefail
          DIR=app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase
          rm -rf /tmp/versioned-room-schemas
          mkdir -p /tmp/versioned-room-schemas
          cp "$DIR"/*.json /tmp/versioned-room-schemas/

      - name: Generate Room schemas through V18
        run: ./gradlew :app:kspDebugKotlin :app:copyRoomSchemas --no-daemon --stacktrace

      - name: Materialize generated Room V18 baseline
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          SCHEMA=app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase/18.json
          test -f "$SCHEMA"
          if git ls-files --error-unmatch "$SCHEMA" >/dev/null 2>&1; then
            echo 'Room V18 baseline already versioned.'
            exit 0
          fi
          cp "$SCHEMA" /tmp/versioned-room-schemas/18.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SCHEMA"
          git commit -m 'chore: version generated Room V18 schema'
          git push origin "HEAD:${HEAD_REF}"

      - name: Retain generated Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: phase7-room-schemas-${{ steps.exact_head.outputs.sha }}
          path: app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: JUnit and performance evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          required = {
            'LegacyCareerCalendarCharacterizationTest','LegacySeasonLifecycleOrderTest',
            'LegacyAnnualRandomRulesTest','LegacyAnnualSelectionRulesTest','LegacyAnnualSquadFloorRulesTest',
            'LegacyAnnualA0IRulesTest','LegacyAnnualA0OrchestrationRulesTest','LegacyAnnualJAndBestFDeepTest',
            'LegacyAnnualPlayerMovementRulesTest','LegacyProceduralPlayerRulesTest','LegacyProceduralNameRulesTest',
            'LegacyProceduralToPlayerRulesTest','LegacyCareerPlayerInitializationRulesTest','LegacyCountryAssetCodesTest',
            'LegacyPlayerValueRulesTest','LegacyProceduralMaterializationRulesTest','CareerPlayerRuntimeMapperTest',
            'CareerPlayerRuntimeStoreTest','CareerMatchStoreTest','CareerMatchPersistedRuntimeResolverTest',
            'CareerMatchEnergyPersistenceTest','CareerMatchPersistedEffectsMapperTest','CareerMatchExecutionCoordinatorTest',
            'LegacyMatchEnergyRulesTest','LegacyLeagueFixtureRulesTest','LegacyFixedLeagueFixtureRulesTest',
            'LegacyLargeFixedLeagueFixtureRulesTest','LegacyNonGroupFixtureRouterTest','LegacyLeagueStandingsRulesTest',
            'LegacyLeagueCompetitionRuntimeTest','LegacyGroupFixtureRulesTest','LegacyGroupFixtureRouterTest',
            'CareerCompetitionStoreTest','CareerCompetitionCycleIntegrationTest','LegacyProceduralNameAssetLoaderTest',
            'LegacyProceduralNameCorpusIntegrationTest','Migration1To2Test','Migration2To3Test','Migration3To4Test',
            'Migration4To5Test','Migration5To6Test','Migration6To7Test','Migration7To8Test','Migration8To9Test',
            'Migration9To10Test','Migration10To11Test','Migration12To13Test','Migration13To14Test','Migration14To15Test',
            'Migration15To16Test','Migration16To17Test','Migration17To18Test','LegacyCompetitionPlayerRatingAggregateRulesTest',
            'LegacyLeagueTransientRatingCaptureRulesTest','CareerMatchPlayerRatingRuntimeExecutorTest',
            'CareerCompetitionPlayerRatingStoreTest','LegacyCompetitionSnapshotRulesTest',
            'CareerLeagueRoundTransientRatingRuntimeTest','CareerCompetitionRoundSnapshotPersistenceTest',
            'CareerSeniorRuntimeStoreTest','CareerManagerRuntimeStoreTest','CareerTicketRuntimeStoreTest',
            'CareerStadiumConstructionRuntimeStoreTest','CareerStadiumConstructionCompletionStoreTest',
            'CareerCoachRuntimeStoreTest','CareerCoachEmploymentPersistenceTest','CareerManagerProgressionRandomStoreTest',
            'CareerCoachPostMatchUpdateResolverTest','CareerCoachPostMatchPersistedResolverTest','LegacyCareerContinuationRuleTest',
            'LegacyCoachMatchManagerResolutionRuleTest','LegacyCoachPostMatchRuntimeRuleTest',
            'LegacyDismissalContinuationRuleTest','LegacyEndOfYearProgressionRuleTest',
            'LegacyManagerEmploymentTransitionRuleTest','LegacyReplacementClubDiscoveryRuleTest',
            'LegacyReplacementManagerCandidateRuleTest','LegacyReplacementManagerResolutionRuleTest',
          }
          seen=set(); tests=failures=errors=skipped=0; benchmark=[]
          files=glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          if not files: raise SystemExit('No JUnit XML files were generated')
          for path in files:
              root=ET.parse(path).getroot()
              t=int(root.attrib.get('tests',0)); f=int(root.attrib.get('failures',0)); e=int(root.attrib.get('errors',0)); s=int(root.attrib.get('skipped',0))
              tests+=t; failures+=f; errors+=e; skipped+=s
              suite=root.attrib.get('name','')
              for name in required:
                  if suite.endswith(name):
                      if t <= 0 or f or e or s: raise SystemExit(f'{name} is not fully green: {(t,f,e,s)}')
                      seen.add(name)
              for node in root.findall('system-out'):
                  if node.text: benchmark += [line for line in node.text.splitlines() if 'PHASE4_CORE_BENCHMARK' in line]
          print(f'PHASE7_TEST_SUMMARY tests={tests} failures={failures} errors={errors} skipped={skipped}')
          if failures or errors: raise SystemExit('JUnit XML reports failures/errors')
          missing=sorted(required-seen)
          if missing: raise SystemExit(f'Required characterization evidence missing: {missing}')
          if not benchmark: raise SystemExit('Core performance evidence was not emitted')
          for line in benchmark: print(line)
          PY

      - name: Verify official Brasfoot 2026 procedural name corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, re
          from pathlib import Path
          root=Path('app/src/main/assets')
          src=Path('app/src/main/java/com/leomala/footballdynasty/domain/career/LegacyCountryAssetCodes.kt').read_text()
          block=src.split('private val codes = arrayOf(',1)[1].split('\n    )',1)[0]
          codes=re.findall(r'"([A-Z0-9]{3})"',block)
          if len(codes)!=221 or len(set(codes))!=221: raise SystemExit(f'Legacy country code table changed: {len(codes)}')
          expected={f'names/{c}.txt' for c in codes}|{f'surnames/{c}.txt' for c in codes}
          actual={str(p.relative_to(root)).replace('\\','/') for d in (root/'names',root/'surnames') for p in d.glob('*.txt')}
          if actual!=expected or len(actual)!=442: raise SystemExit('Official name corpus paths changed')
          physical=[]; semantic=[]; total=0
          for rel in sorted(expected):
              raw=(root/rel).read_bytes(); total+=len(raw); legacy=f'resources/assets/{rel}'
              physical.append(f'{legacy}\t{hashlib.sha256(raw).hexdigest()}\t{len(raw)}\n')
              accepted=[x for x in raw.decode('utf-8',errors='replace').splitlines() if x and '.' not in x and not re.search(r'\d+',x)]
              if not accepted: raise SystemExit(f'Legacy best.u.b filter produced empty asset: {rel}')
              inner=''.join(f'{x}\n' for x in accepted).encode()
              semantic.append(f'{legacy}\t{hashlib.sha256(inner).hexdigest()}\t{len(accepted)}\n')
          ph=hashlib.sha256(''.join(physical).encode()).hexdigest(); sh=hashlib.sha256(''.join(semantic).encode()).hexdigest()
          if total!=495785: raise SystemExit(f'Official name corpus byte count changed: {total}')
          if ph!='4b8c6db9b6343221cb6e945aef7ba0d7dc081c4744e30bb1f9a0eba3c57e444b': raise SystemExit(f'Physical manifest mismatch: {ph}')
          if sh!='d4cb2a6fd770a7bcdb850ee63b31d6442b66a3da70611f7a100e264b1f2c625f': raise SystemExit(f'Semantic manifest mismatch: {sh}')
          if [p for p in root.iterdir() if p.name.startswith('bootstrap') or p.name.startswith('legacy_name_corpus')]: raise SystemExit('Temporary corpus transport remains')
          print(f'PHASE7_NAME_CORPUS_COUNT=442 bytes={total} physical={ph} semantic={sh}')
          PY

      - name: Verify active Brasfoot 2026 fixture integrity
        shell: bash
        run: |
          set -euo pipefail
          base64 -d app/src/test/resources/legacy/trepenne_smr.ban.b64 > /tmp/trepenne_smr.ban
          printf '%s  %s\n' 'c664cc841b44e39423835795b00bb1c248862eb0a0e1c579831857d748fa9281' '/tmp/trepenne_smr.ban' | sha256sum --check --strict

      - name: Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Room schemas and migration policy through V18
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_phase7_room_v17.py

      - name: Phase 7 gate summary
        run: |
          echo "Exact Phase 7 head checkout: PASS (${{ steps.exact_head.outputs.sha }})"
          echo "Raw RNG/destructive migration guards: PASS"
          echo "Gradle help: PASS"
          echo "Room V1/V2/V3/V13 immutable regression + V14 junior-draft + V15 senior-runtime + V16 competition-rating + V17 durability + V18 tactics persistence: PASS"
          echo "Unit tests + migrations through 17->18 + manager/stadium/ticket/coach/competition-input/junior/senior/rating/snapshot/tactics persistence: PASS"
          echo "Brasfoot 2026 corpus/fixture integrity: PASS"
          echo "Phase 9/10 persisted runtime regressions: PASS"
          echo "Room migrations V1->V2->V3->V4->V5->V6->V7->V8->V9->V10->V11->V12->V13->V14->V15->V16->V17->V18: PASS"
          echo "assembleDebug: PASS"
