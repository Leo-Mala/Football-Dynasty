name: Phase 15 V14 Bootstrap

on:
  pull_request:
    branches: [phase4/core-game-domain]

permissions:
  contents: read

concurrency:
  group: phase15-v14-bootstrap-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'milestone-c/full-legacy-parity-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Upgrade Phase 7 guards to Room V14
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/phase4r-validation.yml')
          s=p.read_text()
          replacements=[
            ('Generate Room schemas through V13','Generate Room schemas through V14'),
            ('Materialize generated Room V13 baseline','Materialize generated Room V14 baseline'),
            ('SCHEMA=app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase/13.json\n          test -f "$SCHEMA"\n          if git ls-files --error-unmatch "$SCHEMA"', 'SCHEMA=app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase/14.json\n          test -f "$SCHEMA"\n          if git ls-files --error-unmatch "$SCHEMA"'),
            ("echo 'Room V13 baseline already versioned.'", "echo 'Room V14 baseline already versioned.'"),
            ("git commit -m 'chore: version generated Room V13 schema'", "git commit -m 'chore: version generated Room V14 schema'"),
            ("'Migration9To10Test','Migration10To11Test','Migration12To13Test','CareerManagerRuntimeStoreTest'", "'Migration9To10Test','Migration10To11Test','Migration12To13Test','Migration13To14Test','CareerManagerRuntimeStoreTest'"),
            ("versioned={'1.json','2.json','3.json','13.json'}", "versioned={'1.json','2.json','3.json','13.json','14.json'}"),
            ("generated={'1.json','2.json','3.json','13.json'}", "generated={'1.json','2.json','3.json','13.json','14.json'}"),
            ("13:'6575d77e3eef9ea84d059c2aa2bdf14b'}", "13:'6575d77e3eef9ea84d059c2aa2bdf14b',14:'49734dba8b165fbf8999ac19f3832f1e'}"),
            ("if v13.get('version')!=13 or v13.get('identityHash')!=ids[13]: raise SystemExit('Room V13 identity/version changed')", "if v13.get('version')!=13 or v13.get('identityHash')!=ids[13]: raise SystemExit('Room V13 identity/version changed')\n          v14_before=json.loads((b/'14.json').read_text()); v14_after=json.loads((d/'14.json').read_text())\n          if v14_before!=v14_after: raise SystemExit('Generated Room schema 14.json differs from versioned schema')\n          v14=v14_after['database']; db[14]=v14\n          if v14.get('version')!=14 or v14.get('identityHash')!=ids[14]: raise SystemExit('Room V14 identity/version changed')"),
            ("e3={e['tableName']:e for e in db[3]['entities']}; e13={e['tableName']:e for e in db[13]['entities']}", "e3={e['tableName']:e for e in db[3]['entities']}; e13={e['tableName']:e for e in db[13]['entities']}; e14={e['tableName']:e for e in db[14]['entities']}") ,
            ("if not set(e3).issubset(e13): raise SystemExit('Room V13 does not preserve V3')", "if not set(e3).issubset(e13): raise SystemExit('Room V13 does not preserve V3')\n          if not set(e13).issubset(e14): raise SystemExit('Room V14 does not preserve V13')\n          junior=e14.get('career_junior_drafts'); expected_junior={'careerId','clubId','sourceOrdinal','legacyN','legacyB','legacyC','legacyE','legacyJ','legacyL','legacyD','name','legacyG','legacyF','legacyO','legacyM','legacyH','legacyI','developmentRemainder'}\n          if junior is None or {f['columnName'] for f in junior['fields']}!=expected_junior: raise SystemExit('V14 junior draft contract changed')"),
            ("p14inputs=Path('app/src/main/java/com/leomala/footballdynasty/data/local/Phase14CompetitionInputsMigration.kt').read_text()", "p14inputs=Path('app/src/main/java/com/leomala/footballdynasty/data/local/Phase14CompetitionInputsMigration.kt').read_text(); p15=Path('app/src/main/java/com/leomala/footballdynasty/data/local/Phase15JuniorDraftMigration.kt').read_text()"),
            ("migration12=Path('app/src/test/java/com/leomala/footballdynasty/data/local/Migration12To13Test.kt').read_text()", "migration12=Path('app/src/test/java/com/leomala/footballdynasty/data/local/Migration12To13Test.kt').read_text(); migration13=Path('app/src/test/java/com/leomala/footballdynasty/data/local/Migration13To14Test.kt').read_text()"),
            ("if 'const val SCHEMA_VERSION: Int = 13' not in src: raise SystemExit('SCHEMA_VERSION must be 13')", "if 'const val SCHEMA_VERSION: Int = 14' not in src: raise SystemExit('SCHEMA_VERSION must be 14')"),
            ("if ids[12] not in migration12: raise SystemExit('Migration12To13Test must pin certified V12 identity')", "if ids[12] not in migration12: raise SystemExit('Migration12To13Test must pin certified V12 identity')\n          if ids[13] not in migration13: raise SystemExit('Migration13To14Test must pin certified V13 identity')"),
            ("if re.search(r'\\bINSERT\\s+INTO\\b',p14inputs,re.I) or re.search(r'\\bUPDATE\\s+career_',p14inputs,re.I): raise SystemExit('V11->V13 competition migrations must not backfill exact inputs')", "if re.search(r'\\bINSERT\\s+INTO\\b',p14inputs,re.I) or re.search(r'\\bUPDATE\\s+career_',p14inputs,re.I): raise SystemExit('V11->V13 competition migrations must not backfill exact inputs')\n          if re.search(r'\\bINSERT\\s+INTO\\b',p15,re.I) or re.search(r'\\bUPDATE\\s+career_',p15,re.I): raise SystemExit('V13->V14 junior migration must not backfill draft state')"),
            ("or 'Migration(12, 13)' not in p14inputs: raise SystemExit('V5->V6 through V12->V13 migration chain incomplete')", "or 'Migration(12, 13)' not in p14inputs or 'Migration(13, 14)' not in p15: raise SystemExit('V5->V6 through V13->V14 migration chain incomplete')"),
            ("'MIGRATION_11_12','MIGRATION_12_13']", "'MIGRATION_11_12','MIGRATION_12_13','MIGRATION_13_14']"),
            ("print(f'ROOM_V13_IDENTITY_HASH={v13.get(\"identityHash\")}')", "print(f'ROOM_V13_IDENTITY_HASH={v13.get(\"identityHash\")}'); print(f'ROOM_V14_IDENTITY_HASH={v14.get(\"identityHash\")}')"),
            ("print('ROOM_V13_LEAGUE_SUBTYPE_FAIL_CLOSED_CONTRACT=PASS')", "print('ROOM_V13_LEAGUE_SUBTYPE_FAIL_CLOSED_CONTRACT=PASS'); print('ROOM_V14_JUNIOR_DRAFT_CONTRACT=PASS')"),
            ('Verify Room schemas and migration policy through V13','Verify Room schemas and migration policy through V14'),
            ('Room V1/V2/V3/V13 immutable regression + V4/V5/V6/V7/V8/V9/V10/V11/V12 contract preservation inside V13: PASS','Room V1/V2/V3/V13 immutable regression + V14 junior-draft extension preserving V13: PASS'),
            ('Unit tests + migrations through 12->13 + manager/stadium/ticket/coach/competition-input persistence: PASS','Unit tests + migrations through 13->14 + manager/stadium/ticket/coach/competition-input/junior persistence: PASS'),
            ('Room migrations V1->V2->V3->V4->V5->V6->V7->V8->V9->V10->V11->V12->V13: PASS','Room migrations V1->V2->V3->V4->V5->V6->V7->V8->V9->V10->V11->V12->V13->V14: PASS'),
          ]
          for old,new in replacements:
              if old not in s: raise SystemExit(f'Expected Phase 7 guard text missing: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Upload patched Phase 7 workflow
        uses: actions/upload-artifact@v4
        with:
          name: phase7-v14-guard-patch-${{ github.event.pull_request.head.sha }}
          path: .github/workflows/phase4r-validation.yml
          if-no-files-found: error
          retention-days: 2
