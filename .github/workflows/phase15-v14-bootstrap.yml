name: Phase 15 V14 Bootstrap

on:
  pull_request:
    branches: [phase4/core-game-domain]

permissions:
  contents: write

concurrency:
  group: phase15-v14-bootstrap-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'milestone-c/full-legacy-parity-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37 packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --channel=3 > /tmp/sdk-packages.txt
          PLATFORM="$(awk '/^[[:space:]]*platforms;android-37([^0-9]|$)/ {print $1; exit}' /tmp/sdk-packages.txt)"
          BUILD_TOOLS="$(awk '/^[[:space:]]*build-tools;37\.[0-9]+\.[0-9]+/ {print $1}' /tmp/sdk-packages.txt | sort -V | tail -1)"
          test -n "$PLATFORM" && test -n "$BUILD_TOOLS"
          sdkmanager --channel=3 "$PLATFORM" "$BUILD_TOOLS"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Generate and verify Room V14
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:kspDebugKotlin :app:copyRoomSchemas --no-daemon --stacktrace
          python3 - <<'PY'
          import json
          from pathlib import Path
          schema=Path('app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase/14.json')
          db=json.loads(schema.read_text())['database']
          expected='49734dba8b165fbf8999ac19f3832f1e'
          if db.get('version') != 14 or db.get('identityHash') != expected:
              raise SystemExit(f'Unexpected Room V14: {db.get("version")} {db.get("identityHash")}')
          junior={e['tableName']:e for e in db['entities']}.get('career_junior_drafts')
          fields={f['columnName'] for f in junior['fields']} if junior else set()
          expected_fields={'careerId','clubId','sourceOrdinal','legacyN','legacyB','legacyC','legacyE','legacyJ','legacyL','legacyD','name','legacyG','legacyF','legacyO','legacyM','legacyH','legacyI','developmentRemainder'}
          if fields != expected_fields: raise SystemExit(f'V14 junior fields changed: {sorted(fields)}')
          PY

      - name: Commit generated V14 schema
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          SCHEMA=app/schemas/com.leomala.footballdynasty.data.local.FootballDynastyDatabase/14.json
          if git ls-files --error-unmatch "$SCHEMA" >/dev/null 2>&1; then
            echo 'Room V14 schema already versioned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SCHEMA"
          git commit -m 'chore: version generated Room V14 schema'
          git push origin "HEAD:${HEAD_REF}"
